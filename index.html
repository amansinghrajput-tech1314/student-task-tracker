
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>Student Task Tracker</h1>
            <p>Plan your day. Complete your goals.</p>
        </header>

        <div class="task-form">
            <input type="text" id="taskInput"
                   placeholder="Enter a new task...">

            <select id="prioritySelect">
                <option value="High">High</option>
                <option value="Medium" selected>Medium</option>
                <option value="Low">Low</option>
            </select>

            <button id="addTaskBtn">Add Task</button>
        </div>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <div class="summary">
            <span id="totalCount">Total: 0</span>
            <span id="pendingCount">Pending: 0</span>
            <span id="completedCount">Completed: 0</span>
        </div>

        <ul id="taskList"></ul>

        <p id="emptyMessage">No tasks yet. Add your first task!</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
